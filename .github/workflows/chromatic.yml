name: "Chromatic with CLI"

on: push

jobs:
  vitest:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - name: Install dependencies
        run: npm install
      - name: Run Vitest tests
        #run: npx vitest run --project chromatic
        run: npm run chromatic:tests
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-action
          path: .vitest/chromatic
          retention-days: 1

  chromatic:
    name: Run Chromatic
    needs: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - name: Install dependencies
        # ⚠️ See your package manager's documentation for the correct command to install dependencies in a CI environment.
        run: npm install
      - name: Download Vitest test results
        uses: actions/download-artifact@v8
        with:
          name: test-results-action
          path: .vitest/chromatic
      # - name: Display Vitest test results Action
      #   run: |
      #     echo "Vitest Test Results Action:"
      #     ls -la
      #     echo "Contents of the root directory:"
      #     ls -la .vitest*
      #     echo "Contents of .vitest/ directory:"
      #     cd .vitest
      #     tree
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          # ⚠️ Enable Vitest
          vitest: true
          onlyChanged: true
          exitZeroOnChanges: true
          projectToken: ${{ secrets.CHROMATIC_VITEST_PROJECT_TOKEN }}
          externals: |
            **/*.sass
            **/*.css
            public/**
